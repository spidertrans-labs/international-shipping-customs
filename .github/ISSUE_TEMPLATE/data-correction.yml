name: Data correction
description: Report an outdated or incorrect customs record.
title: "[Data] "
labels:
  - data
body:
  - type: input
    id: record
    attributes:
      label: Record ID
      description: For example AU-03 or US-09.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source URL
      description: Link directly to a government, customs, agriculture, health, or tax authority page.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: Quote the relevant official wording and explain what should change.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this issue does not contain personal data, tracking numbers, or customer records.
          required: true
